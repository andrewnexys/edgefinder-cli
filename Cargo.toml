[package]
name = "edgefinder-cli"
version = "0.1.18"
edition = "2021"
rust-version = "1.88"
description = "EdgeFinder CLI and MCP server for sports analysis"
license = "MIT"
repository = "https://github.com/andrewnexys/edgefinder-cli"
include = [
  "src/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
  "SECURITY.md",
]
keywords = ["sports", "betting", "nfl", "nba", "mcp"]
categories = ["command-line-utilities"]

[[bin]]
name = "edgefinder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
